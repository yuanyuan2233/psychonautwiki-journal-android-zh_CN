name: Build App on new release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*'

jobs:
  build:
    name: Build, sign and release app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Setup Signing Keystore
        if: ${{ secrets.KEYSTORE != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify & Package Release APK
        run: |
          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            APK_FILE="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          
          # 断言必须不是 debuggable
          if ${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt2 dump badging "$APK_FILE" | grep -q 'application-debuggable'; then
            echo "ERROR: Release APK must not be debuggable!"
            exit 1
          fi

          # 断言包名独立性
          ${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt2 dump badging "$APK_FILE" | grep -q "package: name='com.isaakhanimann.journal.zh'" || {
            echo "ERROR: Package name must be com.isaakhanimann.journal.zh!"
            exit 1
          }

          RELEASE_NAME="${{ github.ref_name }}"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="manual-build"
          fi

          RELEASE_APK="PsychonautWiki-Journal-${RELEASE_NAME}.apk"
          cp "$APK_FILE" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > SHA256SUMS.txt
          echo "Release APK verified and packaged successfully:"
          cat SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          name: "release-apk"
          path: |
            PsychonautWiki-Journal-*.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            PsychonautWiki-Journal-*.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
